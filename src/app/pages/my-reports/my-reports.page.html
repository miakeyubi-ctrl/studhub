<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <button
        type="button"
        (click)="goBack()"
        class="w-9 h-9 ml-1 rounded-full bg-primary-50 dark:bg-primary-800 flex items-center justify-center active:scale-90 transition">
        <ion-icon name="chevron-back" class="text-slate-700 dark:text-white text-lg"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title class="text-slate-800 dark:text-white font-bold">
      {{ 'MY_REPORTS.TITLE' | translate }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container py-4 pb-10">

    <p class="text-sm text-slate-500 dark:text-slate-400 mb-4 m-0">
      {{ 'MY_REPORTS.SUBTITLE' | translate }}
    </p>

    <div class="rounded-2xl p-4 mb-5 shadow-sm" style="background: var(--stud-surface)">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-50 dark:bg-amber-500/15 flex items-center justify-center flex-shrink-0">
          <ion-icon name="information-circle-outline" class="text-xl text-amber-600"></ion-icon>
        </div>
        <div>
          <p class="text-sm font-bold text-slate-800 dark:text-white m-0">{{ 'MY_REPORTS.HOW_TITLE' | translate }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 m-0 leading-5">{{ 'MY_REPORTS.HOW_DESC' | translate }}</p>
        </div>
      </div>
    </div>

    <div *ngIf="loading" class="space-y-3">
      <div *ngFor="let i of [0,1,2]" class="h-20 rounded-2xl bg-slate-100 dark:bg-primary-800 animate-pulse"></div>
    </div>

    <div *ngIf="!loading && error" class="text-center py-10 px-4">
      <p class="text-sm font-bold text-slate-700 dark:text-white m-0">{{ 'MY_REPORTS.ERROR_TITLE' | translate }}</p>
      <button type="button" (click)="load()" class="mt-3 text-xs font-bold text-primary-600">
        {{ 'MY_REPORTS.RETRY' | translate }}
      </button>
    </div>

    <div *ngIf="!loading && !error && !items.length" class="text-center py-14 px-4">
      <div class="w-14 h-14 mx-auto rounded-full bg-primary-50 dark:bg-primary-800 flex items-center justify-center mb-3">
        <ion-icon name="flag-outline" class="text-primary-600 text-2xl"></ion-icon>
      </div>
      <p class="text-sm font-bold text-slate-700 dark:text-white m-0">{{ 'MY_REPORTS.EMPTY_TITLE' | translate }}</p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 m-0">{{ 'MY_REPORTS.EMPTY_DESC' | translate }}</p>
      <button
        type="button"
        (click)="goHelp()"
        class="mt-4 px-4 py-2.5 rounded-xl text-xs font-bold bg-primary-600 text-white active:scale-95 transition">
        {{ 'MY_REPORTS.GO_HELP' | translate }}
      </button>
    </div>

    <div class="space-y-2" *ngIf="!loading && items.length">
      <button
        type="button"
        *ngFor="let item of items"
        (click)="openTarget(item)"
        class="report-row w-full text-left flex items-start gap-3 p-3.5 rounded-2xl shadow-sm active:scale-[0.99] transition"
        style="background: var(--stud-surface)">
        <div class="w-11 h-11 rounded-full bg-rose-50 dark:bg-rose-500/15 flex items-center justify-center flex-shrink-0 text-rose-500">
          <ion-icon [name]="typeIcon(item.targetType)" class="text-xl"></ion-icon>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400 m-0">
            {{ typeKey(item.targetType) | translate }}
          </p>
          <p class="text-sm font-bold text-slate-800 dark:text-white mt-0.5 m-0 truncate">{{ item.targetTitle }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 m-0">
            {{ reasonKey(item.reason) | translate }}
          </p>
          <p class="text-[10px] text-slate-400 mt-1.5 m-0">{{ formatDate(item.createdAt) }}</p>
        </div>
        <ion-icon name="chevron-forward" class="text-slate-300 text-base mt-1"></ion-icon>
      </button>
    </div>

  </div>
</ion-content>
