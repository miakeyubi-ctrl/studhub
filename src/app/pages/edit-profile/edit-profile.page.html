<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <button
        type="button"
        (click)="goBack()"
        class="w-9 h-9 ml-1 rounded-full bg-primary-50 dark:bg-primary-800 flex items-center justify-center active:scale-90 transition">
        <ion-icon name="chevron-back" class="text-slate-700 dark:text-white text-lg"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title class="text-slate-800 dark:text-white font-bold">
      {{ 'EDIT_PROFILE.TITLE' | translate }}
    </ion-title>
    <ion-buttons slot="end">
      <button
        type="button"
        (click)="theme.toggleTheme()"
        class="w-9 h-9 mr-1 rounded-full bg-primary-50 dark:bg-primary-800 flex items-center justify-center active:scale-90 transition">
        <ion-icon [name]="theme.isDark ? 'sunny-outline' : 'moon-outline'" class="text-slate-700 dark:text-white text-lg"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container py-4 pb-10">

    <p class="text-sm text-slate-500 dark:text-slate-400 mb-5 m-0">
      {{ 'EDIT_PROFILE.SUBTITLE' | translate }}
    </p>

    <!-- Avatar -->
    <div class="flex flex-col items-center mb-6">
      <button
        type="button"
        (click)="pickAvatar()"
        [disabled]="uploadingAvatar"
        class="relative w-24 h-24 rounded-full overflow-hidden bg-primary-50 dark:bg-primary-800 flex items-center justify-center active:scale-95 transition shadow-md">
        <img *ngIf="hasAvatar" [src]="avatarUrl" alt="" class="w-full h-full object-cover" />
        <span *ngIf="!hasAvatar"
              class="absolute inset-0 flex items-center justify-center text-2xl font-extrabold text-white"
              [style.background]="avatarBg">{{ displayInitials }}</span>
        <span class="absolute bottom-0 inset-x-0 py-1 bg-black/45 text-[10px] font-bold text-white text-center">
          {{ (uploadingAvatar ? 'EDIT_PROFILE.AVATAR_LOADING' : 'EDIT_PROFILE.AVATAR_CHANGE') | translate }}
        </span>
      </button>
      <input #avatarInput type="file" accept="image/*" class="hidden" (change)="onAvatarSelected($event)" />
    </div>

    <form (ngSubmit)="save()" #editProfileForm="ngForm">

      <div *ngIf="errorMessage" class="mb-5 flex items-center gap-2 bg-red-50 dark:bg-red-500/10 text-red-500 text-xs font-medium px-4 py-3 rounded-2xl">
        <ion-icon name="alert-circle-outline" class="text-base"></ion-icon>
        <span>{{ errorMessage | translate }}</span>
      </div>

      <!-- Nom complet -->
      <div class="mb-4">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'AUTH.FULL_NAME_LABEL' | translate }}</label>
        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="person-outline" class="text-lg text-primary-500"></ion-icon>
          <input
            type="text"
            name="fullName"
            [(ngModel)]="fullName"
            [placeholder]="'AUTH.FULL_NAME_PLACEHOLDER' | translate"
            class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white placeholder-slate-400">
        </div>
      </div>

      <!-- Email (lecture seule) -->
      <div class="mb-4">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'AUTH.EMAIL_LABEL' | translate }}</label>
        <div class="mt-2 flex items-center gap-3 bg-slate-100 dark:bg-primary-800/30 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 opacity-70">
          <ion-icon name="mail-outline" class="text-lg text-slate-400"></ion-icon>
          <input type="email" [value]="email" disabled class="w-full bg-transparent outline-none text-sm text-slate-500 dark:text-slate-300">
        </div>
      </div>

      <!-- Téléphone -->
      <div class="mb-4">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'FIELDS.PHONE_LABEL' | translate }}</label>
        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="call-outline" class="text-lg text-primary-500"></ion-icon>
          <input
            type="tel"
            name="phone"
            [(ngModel)]="phone"
            [placeholder]="'FIELDS.PHONE_PLACEHOLDER' | translate"
            class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white placeholder-slate-400">
        </div>
      </div>

      <!-- Nationalité -->
      <div class="mb-4">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'FIELDS.NATIONALITY_LABEL' | translate }}</label>
        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="flag-outline" class="text-lg text-primary-500"></ion-icon>
          <select name="nationality" [(ngModel)]="nationality" class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white">
            <option value="">{{ 'FIELDS.NATIONALITY_PLACEHOLDER' | translate }}</option>
            <option *ngFor="let n of nationalities" [value]="n">{{ n }}</option>
          </select>
        </div>
      </div>

      <!-- Ville -->
      <div class="mb-4">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'FIELDS.CITY_LABEL' | translate }}</label>
        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="location-outline" class="text-lg text-primary-500"></ion-icon>
          <select name="city" [(ngModel)]="city" class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white">
            <option value="">{{ 'FIELDS.CITY_PLACEHOLDER' | translate }}</option>
            <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
          </select>
        </div>
      </div>

      <!-- Université -->
      <div class="mb-4">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'FIELDS.UNIVERSITY_LABEL' | translate }}</label>
        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="school-outline" class="text-lg text-primary-500"></ion-icon>
          <select name="university" [(ngModel)]="university" class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white">
            <option value="">{{ 'FIELDS.UNIVERSITY_PLACEHOLDER' | translate }}</option>
            <option *ngFor="let u of universities" [value]="u.name">{{ u.name }}</option>
          </select>
        </div>
      </div>

      <!-- Niveau d'études -->
      <div class="mb-4">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'EDIT_PROFILE.LEVEL_LABEL' | translate }}</label>
        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="ribbon-outline" class="text-lg text-primary-500"></ion-icon>
          <select name="studyLevel" [(ngModel)]="studyLevel" class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white">
            <option value="">{{ 'EDIT_PROFILE.LEVEL_PLACEHOLDER' | translate }}</option>
            <option *ngFor="let lvl of studyLevels" [value]="lvl.value">{{ lvl.key | translate }}</option>
          </select>
        </div>
      </div>

      <!-- Bio -->
      <div class="mb-8">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'EDIT_PROFILE.BIO_LABEL' | translate }}</label>
        <div style="background: var(--stud-surface)" class="mt-2 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <textarea
            name="bio"
            [(ngModel)]="bio"
            rows="3"
            maxlength="280"
            [placeholder]="'EDIT_PROFILE.BIO_PLACEHOLDER' | translate"
            class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white placeholder-slate-400 resize-none"></textarea>
          <p class="text-[10px] text-slate-400 text-right m-0">{{ bio.length }}/280</p>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading || uploadingAvatar"
        class="w-full py-3.5 rounded-2xl text-white text-sm font-bold bg-primary-600 shadow-md shadow-primary-600/20 active:scale-95 transition-all duration-200 disabled:opacity-60">
        <ion-icon *ngIf="loading" name="reload-outline" class="animate-spin align-middle mr-2"></ion-icon>
        {{ (loading ? 'EDIT_PROFILE.SAVE_LOADING' : 'EDIT_PROFILE.SAVE_BUTTON') | translate }}
      </button>

    </form>

  </div>
</ion-content>
