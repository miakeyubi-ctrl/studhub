<ion-content [fullscreen]="true">

  <div class="min-h-screen bg-slate-50 dark:bg-primary-900 px-6" style="padding-top: env(safe-area-inset-top)">

    <!-- Barre du haut -->
    <div class="flex items-center justify-between pt-5">

      <button
        (click)="goBack()"
        style="background: var(--stud-surface)" class="w-10 h-10 rounded-full shadow-sm flex items-center justify-center text-slate-600 dark:text-white active:scale-95 transition">
        <ion-icon name="chevron-back-outline" class="text-xl"></ion-icon>
      </button>

      <button
        (click)="theme.toggleTheme()"
        style="background: var(--stud-surface)" class="w-10 h-10 rounded-full shadow-sm flex items-center justify-center text-slate-600 dark:text-white active:scale-95 transition">
        <ion-icon [name]="theme.isDark ? 'sunny-outline' : 'moon-outline'" class="text-lg"></ion-icon>
      </button>

    </div>

    <!-- Icône -->
    <div class="flex flex-col items-center mt-2 mb-8">
      <div class="w-16 h-16 rounded-2xl bg-primary-50 dark:bg-primary-800 flex items-center justify-center">
        <ion-icon name="business-outline" class="text-3xl text-primary-600 dark:text-primary-200"></ion-icon>
      </div>
      <h1 class="text-base font-extrabold text-primary-700 dark:text-white mt-3 tracking-tight">{{ 'AGENT_AUTH.SPACE_NAME' | translate }}</h1>
    </div>

    <!-- Titre -->
    <h2 class="text-2xl font-bold text-slate-800 dark:text-white">
      {{ 'AGENT_AUTH.LOGIN_TITLE' | translate }}
    </h2>
    <p class="text-sm text-slate-400 dark:text-slate-300 mt-1 mb-8">
      {{ 'AGENT_AUTH.LOGIN_SUBTITLE' | translate }}
    </p>

    <form>

      <!-- Email -->
      <div class="mb-4">

        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">
          {{ 'AUTH.EMAIL_LABEL' | translate }}
        </label>

        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="mail-outline" class="text-lg text-primary-500"></ion-icon>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
            class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white placeholder-slate-400">
        </div>

      </div>

      <!-- Password -->
      <div class="mb-8">

        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">
          {{ 'AUTH.PASSWORD_LABEL' | translate }}
        </label>

        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="lock-closed-outline" class="text-lg text-primary-500"></ion-icon>
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate"
            class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white placeholder-slate-400">
          <button type="button" (click)="togglePassword()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" class="text-lg text-slate-400"></ion-icon>
          </button>
        </div>

      </div>

      <!-- Bouton Connexion -->
      <a
        routerLink="/agent-dashboard"
        class="block text-center w-full py-3.5 rounded-2xl text-white text-sm font-bold bg-primary-700 shadow-md shadow-primary-700/20 active:scale-95 transition-all duration-200 text-decoration-none">
        {{ 'AUTH.SIGN_IN_BUTTON' | translate }}
      </a>

    </form>

    <!-- Inscription -->
    <div class="text-center mt-8 pb-10">
      <span class="text-sm text-slate-400 dark:text-slate-300">{{ 'AGENT_AUTH.NO_ACCOUNT' | translate }}</span>
      <a routerLink="/agent-register" class="text-sm font-semibold text-primary-600 dark:text-primary-300 ml-1 text-decoration-none">
        {{ 'AGENT_AUTH.CREATE_ACCOUNT_LINK' | translate }}
      </a>
    </div>

  </div>

</ion-content>
