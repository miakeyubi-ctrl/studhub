<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title class="text-slate-800 dark:text-white font-bold">
      {{ 'ADMIN_HOME.TITLE' | translate }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container py-4 space-y-5 pb-10">

    <!-- Carte admin (pas le profil agent / étudiant) -->
    <div class="admin-hero rounded-3xl p-5 shadow-lg">
      <div class="flex items-center gap-4">
        <div class="relative flex-shrink-0">
          <img [src]="avatar" alt="" class="w-16 h-16 rounded-full object-cover ring-2 ring-white/40" />
          <span class="admin-badge-dot" aria-hidden="true">
            <ion-icon name="shield-checkmark"></ion-icon>
          </span>
        </div>
        <div class="min-w-0">
          <p class="text-white/80 text-[11px] font-semibold uppercase tracking-wide m-0 mb-1">
            {{ 'ADMIN_HOME.ROLE_BADGE' | translate }}
          </p>
          <h2 class="text-white font-bold text-lg truncate m-0">{{ name }}</h2>
          <p class="text-white/75 text-xs mt-1 truncate m-0">{{ email }}</p>
        </div>
      </div>
      <p class="text-white/70 text-[12px] mt-4 m-0 leading-snug">
        {{ 'ADMIN_HOME.SUBTITLE' | translate }}
      </p>
    </div>

    <!-- Menu admin -->
    <div class="rounded-2xl shadow-lg overflow-hidden" style="background: var(--stud-surface)">
      <button
        type="button"
        *ngFor="let item of menuItems; let last = last"
        (click)="openItem(item)"
        class="w-full flex items-center gap-3 px-4 py-3.5 text-left active:opacity-80 transition"
        [class.border-b]="!last"
        [class.border-slate-100]="!last"
        [class.dark:border-primary-700]="!last"
        [disabled]="item.soon">
        <div
          class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0"
          [class.bg-red-50]="item.danger"
          [class.dark:bg-red-900/30]="item.danger"
          [class.bg-primary-50]="!item.danger"
          [class.dark:bg-primary-700]="!item.danger">
          <ion-icon
            [name]="item.icon"
            [class.text-red-500]="item.danger"
            [class.text-primary-700]="!item.danger"
            [class.dark:text-primary-200]="!item.danger">
          </ion-icon>
        </div>
        <span
          class="flex-1 text-sm font-semibold"
          [class.text-red-500]="item.danger"
          [class.text-slate-700]="!item.danger"
          [class.dark:text-white]="!item.danger">
          {{ item.label | translate }}
        </span>
        <span
          *ngIf="item.soon"
          class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 dark:bg-primary-700 dark:text-slate-300">
          {{ 'ADMIN_HOME.SOON' | translate }}
        </span>
        <ion-icon
          *ngIf="!item.soon && !item.danger"
          name="chevron-forward"
          class="text-slate-400 text-base">
        </ion-icon>
      </button>
    </div>

    <!-- Apparence -->
    <div class="rounded-2xl shadow-lg flex items-center gap-3 px-4 py-3.5" style="background: var(--stud-surface)">
      <div class="w-9 h-9 rounded-full flex items-center justify-center bg-primary-50 dark:bg-primary-700">
        <ion-icon
          [name]="theme.isDark ? 'moon-outline' : 'sunny-outline'"
          class="text-primary-700 dark:text-primary-200">
        </ion-icon>
      </div>
      <span class="flex-1 text-sm font-semibold text-slate-700 dark:text-white">
        {{ 'PROFILE_PAGE.DARK_MODE' | translate }}
      </span>
      <ion-toggle [checked]="theme.isDark" (ionChange)="theme.toggleTheme()"></ion-toggle>
    </div>

    <!-- Langue -->
    <div class="rounded-2xl shadow-lg flex items-center gap-3 px-4 py-3.5" style="background: var(--stud-surface)">
      <div class="w-9 h-9 rounded-full flex items-center justify-center bg-primary-50 dark:bg-primary-700">
        <ion-icon name="language-outline" class="text-primary-700 dark:text-primary-200"></ion-icon>
      </div>
      <span class="flex-1 text-sm font-semibold text-slate-700 dark:text-white">
        {{ 'LANGUAGE.TITLE' | translate }}
      </span>
      <select
        [ngModel]="language.currentLanguage"
        (ngModelChange)="language.setLanguage($event)"
        class="bg-primary-50 dark:bg-primary-700 text-primary-700 dark:text-primary-200 text-xs font-semibold rounded-full px-3 py-2 border-none outline-none">
        <option *ngFor="let lang of language.languages" [value]="lang.code">
          {{ lang.labelKey | translate }}
        </option>
      </select>
    </div>

  </div>
</ion-content>
