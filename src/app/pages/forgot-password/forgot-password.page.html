<ion-content [fullscreen]="true">

  <div class="min-h-screen bg-slate-50 dark:bg-primary-900 px-6" style="padding-top: env(safe-area-inset-top)">

    <!-- Barre du haut -->
    <div class="flex items-center justify-between pt-5">

      <button
        (click)="goBack()"
        style="background: var(--stud-surface)" class="w-10 h-10 rounded-full shadow-sm flex items-center justify-center text-slate-600 dark:text-white active:scale-95 transition">
        <ion-icon name="chevron-back-outline" class="text-xl"></ion-icon>
      </button>

      <button
        (click)="theme.toggleTheme()"
        style="background: var(--stud-surface)" class="w-10 h-10 rounded-full shadow-sm flex items-center justify-center text-slate-600 dark:text-white active:scale-95 transition">
        <ion-icon [name]="theme.isDark ? 'sunny-outline' : 'moon-outline'" class="text-lg"></ion-icon>
      </button>

    </div>

    <!-- Icône -->
    <div class="flex flex-col items-center mt-6 mb-8">
      <div class="w-16 h-16 rounded-2xl bg-primary-50 dark:bg-primary-800 flex items-center justify-center">
        <ion-icon name="key-outline" class="text-3xl text-primary-600 dark:text-primary-200"></ion-icon>
      </div>
    </div>

    <!-- Titre -->
    <h2 class="text-2xl font-bold text-slate-800 dark:text-white">
      {{ 'AUTH.FORGOT_TITLE' | translate }}
    </h2>
    <p class="text-sm text-slate-400 dark:text-slate-300 mt-1 mb-8">
      {{ 'AUTH.FORGOT_FORM_DESC' | translate }}
    </p>

    <form (ngSubmit)="sendCode()" #forgotForm="ngForm">

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="mb-5 flex items-center gap-2 bg-red-50 dark:bg-red-500/10 text-red-500 text-xs font-medium px-4 py-3 rounded-2xl">
        <ion-icon name="alert-circle-outline" class="text-base"></ion-icon>
        <span>{{ errorMessage | translate }}</span>
      </div>

      <!-- Email -->
      <div class="mb-8">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wide">{{ 'AUTH.EMAIL_LABEL' | translate }}</label>

        <div style="background: var(--stud-surface)" class="mt-2 flex items-center gap-3 border border-slate-200 dark:border-primary-700 rounded-2xl px-4 py-3.5 focus-within:border-primary-500 transition-colors">
          <ion-icon name="mail-outline" class="text-lg text-primary-500"></ion-icon>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
            class="w-full bg-transparent outline-none text-sm text-slate-800 dark:text-white placeholder-slate-400">
        </div>
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3.5 rounded-2xl text-white text-sm font-bold bg-primary-600 shadow-md shadow-primary-600/20 active:scale-95 transition-all duration-200 disabled:opacity-60">

        <ion-icon *ngIf="loading" name="reload-outline" class="animate-spin align-middle mr-2"></ion-icon>
        {{ (loading ? 'AUTH.SEND_CODE_LOADING' : 'AUTH.SEND_CODE_BUTTON') | translate }}

      </button>

    </form>

    <!-- Retour connexion -->
    <div class="text-center mt-8 pb-10">
      <span class="text-sm text-slate-400 dark:text-slate-300">{{ 'AUTH.REMEMBER_PASSWORD' | translate }}</span>
      <a routerLink="/login" class="text-sm font-semibold text-primary-600 dark:text-primary-300 ml-1 text-decoration-none">{{ 'AUTH.SIGN_IN_LINK' | translate }}</a>
    </div>

  </div>

</ion-content>
