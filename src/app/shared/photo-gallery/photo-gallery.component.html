<div class="photo-gallery relative bg-primary-900" *ngIf="images.length">

  <div [id]="galleryId" class="splide photo-gallery__main">
    <div class="splide__track">
      <ul class="splide__list">
        <li class="splide__slide" *ngFor="let img of images">
          <img
            [src]="img"
            [alt]="title"
            referrerpolicy="no-referrer"
            draggable="false"
            class="w-full h-full object-cover select-none" />
        </li>
      </ul>
    </div>
  </div>

  <ng-container *ngIf="hasMultiple">
    <button
      type="button"
      (click)="prevPhoto($event)"
      class="gallery-nav gallery-nav--prev"
      [attr.aria-label]="'COMMON.BACK' | translate">
      <ion-icon name="chevron-back" class="text-white text-xl"></ion-icon>
    </button>
    <button
      type="button"
      (click)="nextPhoto($event)"
      class="gallery-nav gallery-nav--next"
      aria-label="Suivant">
      <ion-icon name="chevron-forward" class="text-white text-xl"></ion-icon>
    </button>
  </ng-container>

  <div class="photo-gallery__overlays">
    <ng-content></ng-content>
  </div>

  <button
    type="button"
    class="photo-gallery__badge"
    (click)="openAllPhotos($event)"
    [attr.aria-label]="'GALLERY.VIEW_ALL' | translate">
    <ion-icon name="images-outline" class="text-sm"></ion-icon>
    <span>{{ currentPhotoNumber }}/{{ images.length }}</span>
  </button>

</div>

<ion-modal [isOpen]="allPhotosOpen" (didDismiss)="closeAllPhotos()">
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-buttons slot="start" *ngIf="lightboxOpen">
          <ion-button (click)="backToGrid()">
            <ion-icon name="grid-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title class="text-sm font-bold">
          {{ 'GALLERY.ALL_PHOTOS' | translate: { count: images.length } }}
        </ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="closeAllPhotos()">
            <ion-icon name="close" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <div *ngIf="!lightboxOpen" class="p-2 pb-8">
        <p class="text-xs text-slate-500 dark:text-slate-400 px-1 mb-2">
          {{ 'GALLERY.TAP_TO_ZOOM' | translate }}
        </p>
        <div class="grid grid-cols-3 gap-1.5">
          <button
            type="button"
            *ngFor="let img of images; let i = index"
            (click)="openLightbox(i)"
            class="photo-gallery__thumb rounded-lg overflow-hidden aspect-square active:opacity-80">
            <img [src]="img" [alt]="title + ' ' + (i + 1)" class="w-full h-full object-cover" referrerpolicy="no-referrer" />
          </button>
        </div>
      </div>

      <div *ngIf="lightboxOpen" class="photo-gallery__lightbox h-full bg-black flex flex-col">
        <div [id]="galleryId + '-lightbox'" class="splide flex-1">
          <div class="splide__track h-full">
            <ul class="splide__list h-full">
              <li class="splide__slide flex items-center justify-center" *ngFor="let img of images">
                <img
                  [src]="img"
                  [alt]="title"
                  class="max-w-full max-h-[75vh] object-contain"
                  referrerpolicy="no-referrer" />
              </li>
            </ul>
          </div>
        </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
